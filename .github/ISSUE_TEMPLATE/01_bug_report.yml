name: Alpha 问题反馈
description: 报告氯离子定制界面或连接控制问题
title: "[Alpha]: "
body:
  - type: markdown
    attributes:
      value: |
        请先查看已知问题。不要提交节点/订阅链接、UUID、密码、密钥、配置数据库或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: Windows 与应用版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤和预期/实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的截图或错误摘要（可选）
